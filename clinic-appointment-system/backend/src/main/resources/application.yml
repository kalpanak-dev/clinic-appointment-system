server:
  port: 8080
  error:
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clinic?createDatabaseIfNotExist=true}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
app:
  jwt-secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-1234}
  jwt-expiration-ms: 86400000
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: no-reply@clinic.local
clinic:
  open-hour: 9
  close-hour: 17
  slot-minutes: 30
